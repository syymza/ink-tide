<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f1e9"><meta name="description" content="An unhurried paper-marbling studio. Drop pigment, draw a comb, keep a little accident.">
  <title>Ink Tide — a paper marbling studio</title><link rel="stylesheet" href="style.css"><link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%226%22%20fill%3D%22%23f4f1e9%22%2F%3E%3Cpath%20d%3D%22M7%2013c5-8%2013%208%2018%200M7%2020c5-8%2013%208%2018%200%22%20fill%3D%22none%22%20stroke%3D%22%2342685d%22%20stroke-width%3D%222.5%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E">
</head>
<body>
  <header><a class="wordmark" href="./" aria-label="Ink Tide home">Ink Tide<span class="mark">≈</span></a><button id="save" class="save">Save paper <span aria-hidden="true">↗</span></button></header>
  <main>
    <div class="studio">
      <section class="workspace" aria-label="Marbling studio">
        <div class="paper-frame"><canvas id="paper" width="1500" height="1100" aria-label="Marbled paper. Tap to spread pigment or drag to comb." tabindex="0"></canvas><div id="drop-ghost" aria-hidden="true"><svg viewBox="0 0 24 38"><path d="M12 2C11 12 3 17 3 25a9 9 0 0 0 18 0C21 17 13 12 12 2Z"/></svg></div><div id="comb-cursor" aria-hidden="true"><svg viewBox="0 0 300 38"><rect class="comb-head" x="-3" y="-3" width="306" height="10" rx="2"/><path d="M2 7V36M51 7V36M100 7V36M150 7V36M200 7V36M249 7V36M298 7V36"/></svg></div><div id="tool-cursor" aria-hidden="true"></div><div id="brush-cursor" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 20 9-12 3 2-9 12Z" fill="#aa8963" stroke="#806b4e"/><path d="m13 8 2-3 3 2-2 3Z" fill="#b8b7a6"/><path class="bristles" d="M15 5q0-4 6-4-1 5-3 6Z"/><path d="m17 5 3-3" stroke="#f5e7c677"/></svg><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 22 1-11h3l1 11Z" fill="#aa8963" stroke="#806b4e"/><path d="M10 10h5v3h-5Z" fill="#b8b7a6"/><path class="bristles" d="m10 10-7-7q9-5 18 0l-6 7Z"/><path d="m5 3 6 7m-3-8 4 8m0-8v8m4-8-3 8m6-7-5 7" stroke="#f5e7c688" stroke-width=".6"/></svg></div></div>
        <div class="under-paper" aria-live="polite"><span id="hint">Draw slowly across the paper to comb the colour.</span><span class="paper-number">Study <span id="study">01</span> / Ink on ivory</span></div>
        <div class="tools" role="toolbar" aria-label="Paper tools">
          <div class="tool-pair"><button id="drop" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 4 6 6M15 3l6 6-3 3-6-6Zm-3 5L4 16v4h4l8-8M6 17l2 2"/></svg>Drop</button><button id="comb" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="5" rx="1" style="fill:#bda17c;stroke:#806b4e"/><path d="M4 9v11m4-11v11m4-11v11m4-11v11m4-11v11"/></svg>Comb</button><button id="round" aria-pressed="false" aria-label="Round brush"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 20 9-12 3 2-9 12Z" fill="#aa8963" stroke="#806b4e"/><path d="m13 8 2-3 3 2-2 3Z" fill="#b8b7a6"/><path class="bristles" d="M15 5q0-4 6-4-1 5-3 6Z"/><path d="m17 5 3-3" stroke="#f5e7c677"/></svg>Round</button><button id="fan" aria-pressed="false" aria-label="Fan brush"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 22 1-11h3l1 11Z" fill="#aa8963" stroke="#806b4e"/><path d="M10 10h5v3h-5Z" fill="#b8b7a6"/><path class="bristles" d="m10 10-7-7q9-5 18 0l-6 7Z"/><path d="m5 3 6 7m-3-8 4 8m0-8v8m4-8-3 8m6-7-5 7" stroke="#f5e7c688" stroke-width=".6"/></svg>Fan</button></div>
          <button id="palette-toggle" aria-expanded="false" aria-controls="pigment-box"><i class="current-ink"></i><span>Pigments</span></button>
          <button id="rinse" hidden aria-label="Rinse brush in water"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18l-2 13H5Z" fill="#d8ddd4" stroke="#a0afa4"/><ellipse cx="12" cy="7" rx="9" ry="3" fill="#b8caca" stroke="#819c9a"/><path d="M6 7q6-2 12 0" stroke="#f7fbef"/></svg><span>Rinse</span></button><span id="brush-state" hidden aria-live="polite"></span><button id="undo" disabled aria-label="Undo last gesture"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5 3 10l5 5M3 10h10a6 6 0 0 1 0 12" transform="translate(0 -3)"/></svg><span>Undo</span></button><button id="new" title="Start a new study; you can undo this">Fresh paper</button>
        </div>
      </section>
      <aside id="pigment-box" aria-label="Liquid pigment box"><div class="palette-heading"><p class="eyebrow">Pigments</p><button id="close-palette" aria-label="Close pigment box">×</button></div><div id="wells" role="group" aria-label="Choose a liquid pigment"></div><div class="picked"><svg class="glass-dropper" viewBox="0 0 140 42" aria-hidden="true"><g id="palette-pipette" transform="translate(124 21) rotate(-90) scale(.45)"></g></svg><span id="pigment-name">Juniper</span><span id="pigment-code">PG 18</span></div></aside>
    </div>
  </main>
  <footer><a href="https://content.lib.washington.edu/dpweb/patterns.html" target="_blank" rel="noreferrer" aria-label="Marbled paper reference collection">Paper references ↗</a></footer>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="marbling.js"></script><script src="app.js"></script>
</body></html>
